<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add product · ShopSphere Lite</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <div class="container nav">
        <a class="brand" href="{{ url_for('index') }}">
            ShopSphere Lite
        </a>

        <a href="{{ url_for('index') }}">
            ← Catalogue
        </a>
    </div>
</header>

<main class="container narrow">

    <section class="card">

        <span class="eyebrow">
            Lab feature
        </span>

        <h1>
            Add a product
        </h1>

        <p class="muted">
            This simple admin page is intentionally basic.
            Security will be addressed later in the Cloud journey.
        </p>

        {% if error %}
        <p class="error">
            {{ error }}
        </p>
        {% endif %}

        <form class="form" method="post">

            <label>
                Product name
                <input name="name" required>
            </label>

            <label>
                Category
                <input name="category" required>
            </label>

            <label>
                Price
                <input
                    name="price"
                    type="number"
                    min="0.01"
                    step="0.01"
                    required
                >
            </label>

            <label>
                Description
                <textarea
                    name="description"
                    rows="4"
                    required
                ></textarea>
            </label>

            <button class="button" type="submit">
                Add product
            </button>

        </form>

    </section>

</main>

</body>
</html>
